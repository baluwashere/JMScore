name: T4D BTC Rare Move

on:
  push:
    branches:
      - feat/t4d-btc-rare-move-jev
    paths:
      - 'research/t4d_btc_rare_move_jev/PROTOCOL.md'
      - 'research/t4d_btc_rare_move_jev/run.py'
      - '.github/workflows/t4d-btc-rare-move.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rare-move-btc-2023:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install research dependencies
        run: python -m pip install --disable-pip-version-check numpy scikit-learn

      - name: Run preregistered BTC rare-move gate
        run: python research/t4d_btc_rare_move_jev/run.py

      - name: Upload research results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t4d-btc-rare-move-2023
          path: research/t4d_btc_rare_move_jev/results/
          retention-days: 30
          if-no-files-found: warn
