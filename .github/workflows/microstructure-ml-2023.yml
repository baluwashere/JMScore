name: Microstructure ML 2023

on:
  push:
    branches:
      - feat/t4c-microstructure-ml-2023
    paths:
      - 'research/microstructure_ml_2023/**'
      - '.github/workflows/microstructure-ml-2023.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  microstructure-ml-2023:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install research dependencies
        run: python -m pip install --disable-pip-version-check numpy scikit-learn

      - name: Run preregistered microstructure plus ML pilot
        run: python research/microstructure_ml_2023/run.py

      - name: Upload research results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: microstructure-ml-2023-pilot
          path: research/microstructure_ml_2023/results/
          retention-days: 30
          if-no-files-found: warn
